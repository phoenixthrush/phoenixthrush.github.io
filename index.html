            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            opacity: 0.85;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .top-pill-nav a:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        .top-pill-nav a:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
            opacity: 1;
        }

        @keyframes grow {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

                overflow-x: auto;
